# 🦀 A Cargo *workspace*: several crates that build together, share one
# Cargo.lock and one target/ directory. Splitting the project lets the
# pure-Rust scene code (no GPU!) compile and test on any machine, while the
# renderer depends on it.
[workspace]
resolver = "3"
members = ["crates/x3d-scene", "crates/x3d-render"]

# 🦀 Shared metadata: member crates say `edition.workspace = true`.
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hagopjay/x3d.wgpu"

# 🦀 One place to pin versions. Members write `glam = { workspace = true }`.
[workspace.dependencies]
x3d-scene = { path = "crates/x3d-scene" }
glam = { version = "0.34", features = ["bytemuck"] }
roxmltree = "0.21"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
proptest = "1"
serde_json = "1"
sha2 = "0.10"

# 🦀 Lints for every crate in the workspace. `cargo clippy` enforces these.
[workspace.lints.rust]
unsafe_code = "deny"            # Safe Rust, except one audited call in pipeline_cache.rs.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A few pedantic lints that teach good habits without being noisy:
cast_lossless = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
needless_pass_by_value = "warn"

# Faster debug builds for the math-heavy deps (glam, image, naga) while
# keeping our own code debuggable.
[profile.dev.package."*"]
opt-level = 2
