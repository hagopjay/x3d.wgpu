[package]
name = "x3d-render"
description = "A small wgpu (Vulkan/Metal/DX12) renderer for X3D scenes: windowed viewer and headless PNG renders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "x3d-view"
path = "src/main.rs"

[dependencies]
x3d-scene = { workspace = true, features = ["bytemuck"] }
glam = { workspace = true }
bytemuck = { workspace = true }
wgpu = { workspace = true, features = ["naga-ir"] }
pollster = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
winit = { workspace = true, optional = true }
# wgpu's own shader compiler: X3D ComposedShaders arrive as GLSL.
naga = { version = "30", features = ["glsl-in", "wgsl-in"] }
# Conformance receipts: expected values in, receipt out, scene hashes checked.
serde_json = { workspace = true }
sha2 = { workspace = true }

[features]
# 🦀 `cargo build --no-default-features` gives a headless-only renderer
# (no windowing crates at all) — handy for CI and servers.
default = ["window"]
window = ["dep:winit"]

[lints]
workspace = true
