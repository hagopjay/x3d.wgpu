[package]
name = "x3d-web"
description = "x3d.wgpu in the browser: the same Rust renderer compiled to WebAssembly, WebGPU first with a WebGL2 fallback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
x3d-scene = { workspace = true, features = ["bytemuck"] }
x3d-render = { path = "../x3d-render", default-features = false }
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
glam = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[lints]
workspace = true
