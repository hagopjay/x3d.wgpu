name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # A software Vulkan driver (lavapipe), so the GPU tests run on a CPU-only runner.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p x3d-render --no-default-features   # headless-only build
      - name: Render every sample scene
        run: |
          mkdir -p renders
          for f in scenes/*.x3d; do
            cargo run -q --release -- render "$f" -o "renders/$(basename "$f" .x3d).png" --backend vulkan
          done
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders/
